        let currentModuleKey = "1";

        function changeModule(modNum) {
            currentModuleKey = modNum;
            document.getElementById('scoreBox').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'block';
            renderCurrentModule();
        }

        function renderCurrentModule() {
            const data = readingData[currentModuleKey] || readingData["1"];

            document.getElementById('passageTitle').innerHTML = `<i class="fa-solid fa-book-open"></i> ${data.title}`;
            document.getElementById('passageText').textContent = data.passage;

            mcqAns = {}; tfAns = {}; userDragState = {};

            // Render MCQ
            const mcqDiv = document.getElementById('mcqContainer');
            mcqDiv.innerHTML = '';
            data.mcq.forEach((item, idx) => {
                let html = `<div class="card"><p style="font-weight:700; margin-top:0;">${item.q}</p><div class="opt-grid">`;
                item.opts.forEach((o, oIdx) => {
                    html += `<button class="opt-btn" id="mcq_${idx}_${oIdx}" onclick="selectMCQ(${idx}, ${oIdx})">${o}</button>`;
                });
                html += `</div></div>`;
                mcqDiv.innerHTML += html;
            });

            // Render TF
            const tfDiv = document.getElementById('tfContainer');
            tfDiv.innerHTML = '';
            data.tf.forEach((item, idx) => {
                tfDiv.innerHTML += `
                    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:700;">${item.q}</span>
                        <div>
                            <button class="tf-btn" id="tf_${idx}_TRUE" onclick="selectTF(${idx}, 'TRUE')">TRUE</button>
                            <button class="tf-btn" id="tf_${idx}_FALSE" onclick="selectTF(${idx}, 'FALSE')">FALSE</button>
                        </div>
                    </div>`;
            });

            // Render Spelling
            const spDiv = document.getElementById('spellingContainer');
            spDiv.innerHTML = '';
            data.spelling.forEach((item, idx) => {
                spDiv.innerHTML += `
                    <div class="card">
                        <label style="font-weight:700; display:block; margin-bottom:6px;">${item.hint}</label>
                        <input type="text" class="spelling-input" id="spell_${idx}" placeholder="Type full correct spelling...">
                    </div>`;
            });

            // Render Drag
            const dragDiv = document.getElementById('dragContainer');
            dragDiv.innerHTML = '';
            data.drag.forEach((item, idx) => {
                userDragState[idx] = [];
                let shuffled = [...item.words].sort(() => Math.random() - 0.5);
                
                let html = `
                    <div class="card">
                        <p style="font-weight:700; margin-top:0;">Sentence ${idx + 1}: Click words to build the sentence</p>
                        <div class="sentence-target" id="target_${idx}"></div>
                        <div class="word-pool" id="pool_${idx}">`;
                
                shuffled.forEach((w, wIdx) => {
                    html += `<span class="word-chip" id="chip_${idx}_${wIdx}" onclick="moveWord(${idx}, '${w.replace(/'/g, "\\'")}', 'chip_${idx}_${wIdx}')">${w}</span>`;
                });

                html += `</div></div>`;
                dragDiv.innerHTML += html;
            });
        }

        function selectMCQ(qIdx, oIdx) {
            mcqAns[qIdx] = oIdx;
            const data = readingData[currentModuleKey] || readingData["1"];
            data.mcq[qIdx].opts.forEach((_, i) => {
                document.getElementById(`mcq_${qIdx}_${i}`).classList.toggle('selected', i === oIdx);
            });
        }

        function selectTF(idx, val) {
            tfAns[idx] = val;
            document.getElementById(`tf_${idx}_TRUE`).classList.toggle('selected', val === 'TRUE');
            document.getElementById(`tf_${idx}_FALSE`).classList.toggle('selected', val === 'FALSE');
        }

        function moveWord(qIdx, word, chipId) {
            const chip = document.getElementById(chipId);
            const target = document.getElementById(`target_${qIdx}`);
            const pool = document.getElementById(`pool_${qIdx}`);

            if (chip.parentElement.id === `pool_${qIdx}`) {
                target.appendChild(chip);
            } else {
                pool.appendChild(chip);
            }
        }

        function checkAllAnswers() {
            const data = readingData[currentModuleKey] || readingData["1"];
            let score = 0;

            // MCQ
            data.mcq.forEach((item, i) => { if (mcqAns[i] === item.ans) score++; });

            // TF
            data.tf.forEach((item, i) => { if (tfAns[i] === item.ans) score++; });

            // Spelling
            data.spelling.forEach((item, i) => {
                const input = document.getElementById(`spell_${i}`).value.trim().toLowerCase();
                if (input === item.ans.toLowerCase()) score++;
            });

            // Drag
            data.drag.forEach((item, i) => {
                const target = document.getElementById(`target_${i}`);
                const builtSentence = Array.from(target.children).map(c => c.textContent).join(' ');
                if (builtSentence === item.correct) score++;
            });

            const percent = Math.round((score / 30) * 100);
            document.getElementById('scoreTitle').textContent = `Your Score: ${score} / 30 (${percent}%)`;
            document.getElementById('scoreMsg').textContent = percent >= 80 ? "🌟 Excellent work! You mastered this module!" : "👍 Good effort! Keep practicing!";
            document.getElementById('scoreBox').style.display = 'block';
            document.getElementById('submitBtn').style.display = 'none';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
