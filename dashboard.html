<script>
    const DASHBOARD_PASSWORD = "guru123";
    const defaultUrl = "https://script.google.com/macros/s/AKfycbyMSnlwreTDF193zw4E6IRg9nxuc55aJ4xS4AWpQcwmk8fMjQ54Gznf8Wsn5ufdlfiHog/exec";

    let rawData = [];
    let moduleChartInstance = null;

    // FUNGSI CARI NILAI DARI KUNCI/HEADER BERBEZA
    function getVal(item, possibleKeys) {
        if (!item || typeof item !== 'object') return '';
        
        // 1. Semak kunci tepat
        for (let k of possibleKeys) {
            if (item[k] !== undefined && item[k] !== null && item[k] !== '') {
                return String(item[k]).trim();
            }
        }
        
        // 2. Semak fleksibel (abaikan huruf besar/kecil & ruang kosong)
        const itemKeys = Object.keys(item);
        for (let k of possibleKeys) {
            const target = k.toLowerCase().replace(/[^a-z0-9]/g, '');
            for (let ik of itemKeys) {
                const current = ik.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (target === current && item[ik] !== undefined && item[ik] !== null && item[ik] !== '') {
                    return String(item[ik]).trim();
                }
            }
        }
        return '';
    }

    // PEMPROSESAN SKOR PERATUS (DARIPADA 'PERATUS' ATAU 'SCORE' 21/30)
    function parsePercentage(peratusStr, scoreStr) {
        // A. Semak lajur PERATUS dahulu
        if (peratusStr !== '' && peratusStr !== undefined && peratusStr !== null) {
            let str = String(peratusStr).replace('%', '').trim();
            let num = parseFloat(str);
            if (!isNaN(num)) {
                // Jika Google Sheet bagi nilai perpuluhan (contoh 0.70 untuk 70%)
                if (num > 0 && num <= 1.0) {
                    return Math.round(num * 100);
                }
                return Math.round(num);
            }
        }

        // B. Jika PERATUS tiada, kira automatik dari lajur SCORE (contoh: "21/30")
        if (scoreStr !== '' && scoreStr !== undefined && scoreStr !== null) {
            let str = String(scoreStr).trim();
            if (str.includes('/')) {
                let parts = str.split('/');
                let obtained = parseFloat(parts[0]);
                let total = parseFloat(parts[1]);
                if (!isNaN(obtained) && !isNaN(total) && total > 0) {
                    return Math.round((obtained / total) * 100);
                }
            }
            let num = parseFloat(str);
            if (!isNaN(num)) {
                if (num > 0 && num <= 1.0) return Math.round(num * 100);
                return Math.round(num);
            }
        }

        return 0;
    }

    // NORMALISASI DATA (2D ARRAY ATAU ARRAY OF OBJECTS)
    function processRawData(data) {
        if (!Array.isArray(data) || data.length === 0) return [];

        let rows = [];

        // Jika data dari Apps Script berbentuk 2D Array: [ ["TIMESTAMP", "NAME", ...], [...] ]
        if (Array.isArray(data[0])) {
            const headers = data[0].map(h => String(h).trim());
            for (let i = 1; i < data.length; i++) {
                let obj = {};
                data[i].forEach((val, idx) => {
                    if (headers[idx]) {
                        obj[headers[idx]] = val;
                    }
                });
                rows.push(obj);
            }
        } else {
            // Jika data berbentuk Array of Objects
            rows = data;
        }

        return rows.map(item => {
            const peratusRaw = getVal(item, ['PERATUS', 'Peratus', 'peratus', 'Skor Peratus', 'Percentage']);
            const scoreRaw = getVal(item, ['SCORE', 'Score', 'Skor', 'skor', 'Markah']);
            
            return {
                Timestamp: getVal(item, ['TIMESTAMP', 'Timestamp', 'Tarikh / Masa', 'Tarikh', 'Masa', 'Date']),
                Nama: getVal(item, ['NAME', 'Name', 'Nama', 'Nama Murid', 'Nama_Murid']),
                Kelas: getVal(item, ['CLASS', 'Class', 'Kelas']),
                Kategori: getVal(item, ['CATEGORY', 'Category', 'Kategori', 'Set / Kategori', 'Set']),
                Modul: getVal(item, ['MODULE', 'Module', 'Modul']),
                Skor: parsePercentage(peratusRaw, scoreRaw)
            };
        });
    }

    // KESELAMATAN LOG MASUK GURU
    window.onload = function() {
        const auth = sessionStorage.getItem('guruAuthenticatedYear4');
        if (!auth) {
            const pwd = prompt("Sila masukkan Kata Laluan Portal Guru (Year 4):");
            if (pwd === DASHBOARD_PASSWORD) {
                sessionStorage.setItem('guruAuthenticatedYear4', 'true');
                initDashboard();
            } else {
                alert("Kata laluan tidak sah!");
                window.location.href = "index.html";
            }
        } else {
            initDashboard();
        }
    };

    function logoutGuru() {
        sessionStorage.removeItem('guruAuthenticatedYear4');
        window.location.reload();
    }

    function initDashboard() {
        const savedUrl = localStorage.getItem('year4DashboardUrl') || defaultUrl;
        document.getElementById('customScriptUrl').value = savedUrl;
        fetchSheetData();
    }

    function simpanScriptUrl() {
        const inputUrl = document.getElementById('customScriptUrl').value.trim();
        if (inputUrl) {
            localStorage.setItem('year4DashboardUrl', inputUrl);
            alert("URL Apps Script Year 4 berjaya disimpan!");
            fetchSheetData();
        }
    }

    function getActiveUrl() {
        return localStorage.getItem('year4DashboardUrl') || defaultUrl;
    }

    function fetchSheetData() {
        const url = getActiveUrl();
        const refreshIcon = document.getElementById('refresh-icon');
        
        if (!url) {
            document.getElementById('table-body').innerHTML = `
                <tr><td colspan="8" style="text-align:center; color:#e11d48; padding: 25px;">
                    ⚠️ Sila masukkan URL Google Apps Script Year 4 di ruangan tetapan atas dan tekan "Simpan URL".
                </td></tr>`;
            return;
        }

        refreshIcon.classList.add('fa-spin');

        fetch(url)
            .then(res => res.json())
            .then(data => {
                refreshIcon.classList.remove('fa-spin');
                if (Array.isArray(data)) {
                    rawData = processRawData(data);
                    document.getElementById('lastUpdated').innerText = `Dikemaskini: ${new Date().toLocaleTimeString('ms-MY')}`;
                    updateDashboard();
                } else {
                    alert("Format data tidak sah diterima dari Google Sheet!");
                }
            })
            .catch(err => {
                refreshIcon.classList.remove('fa-spin');
                console.error(err);
                document.getElementById('table-body').innerHTML = `
                    <tr><td colspan="8" style="text-align:center; color:#b91c1c; padding: 25px;">
                        ❌ Gagal memuat turun data! Pastikan URL Google Apps Script sah & mod Web App di-deploy dengan kebenaran "Anyone".
                    </td></tr>`;
            });
    }

    function getInterventionText(percent, category) {
        if (percent >= 90) {
            return "🌟 Cemerlang: Diberikan latihan pengukuhan bertahap tinggi & modul cabaran murid.";
        } else if (percent >= 51) {
            return "👍 Sederhana: Diberikan bimbingan terpandu & perbincangan jawapan secara berkumpulan.";
        } else {
            const cat = (category || "").toUpperCase();
            if (cat.includes("REMEDIAL")) {
                return "🚨 Intervensi: Latihan khas Phonics & pengecaman perbendaharaan kata berasaskan kad bergambar.";
            } else if (cat.includes("WORD POWER") || cat.includes("WORD REPEAT")) {
                return "🚨 Intervensi: Ejaan terpandu & pengukuhan makna kosa kata asas modul.";
            } else if (cat.includes("READING")) {
                return "🚨 Intervensi: Bimbingan bacaan ayat pendek berulang & pemahaman ayat asas.";
            } else if (cat.includes("GRAMMAR")) {
                return "🚨 Intervensi: Ulang kaji tatabahasa asas (Grammar focus) berasaskan nota grafik mudah.";
            } else if (cat.includes("BUILD SENTENCE") || cat.includes("SENTENCE")) {
                return "🚨 Intervensi: Latihan menyusun semula perkataan (Sentence Framing) & penulisan ayat asas.";
            }
            return "🚨 Intervensi Utama: Sesi bimbingan peribadi 1-ke-1 (PULIH).";
        }
    }

    function updateDashboard() {
        const searchTerm = document.getElementById('filter-search').value.toLowerCase();
        const selectedClass = document.getElementById('filter-class').value;
        const selectedModule = document.getElementById('filter-module').value;
        const selectedCategory = document.getElementById('filter-category').value;
        const selectedStatus = document.getElementById('filter-status').value;
        const sortBy = document.getElementById('sort-by').value;

        // Tapis Data
        let filtered = rawData.filter(item => {
            const nameMatch = (item.Nama || "").toLowerCase().includes(searchTerm);
            const classMatch = (selectedClass === "all") || ((item.Kelas || "").toLowerCase() === selectedClass.toLowerCase());
            const moduleMatch = (selectedModule === "all") || ((item.Modul || "").toLowerCase().includes(selectedModule.toLowerCase()));
            const catMatch = (selectedCategory === "all") || ((item.Kategori || "").toUpperCase().includes(selectedCategory.toUpperCase()));
            
            const score = parseFloat(item.Skor) || 0;
            let status = "sederhana";
            if (score >= 90) status = "cemerlang";
            else if (score <= 50) status = "intervensi";

            const statusMatch = (selectedStatus === "all") || (status === selectedStatus);

            return nameMatch && classMatch && moduleMatch && catMatch && statusMatch;
        });

        // Susun Data
        filtered.sort((a, b) => {
            if (sortBy === "score-desc") return (parseFloat(b.Skor) || 0) - (parseFloat(a.Skor) || 0);
            if (sortBy === "score-asc") return (parseFloat(a.Skor) || 0) - (parseFloat(b.Skor) || 0);
            if (sortBy === "name") return (a.Nama || "").localeCompare(b.Nama || "");
            
            // Susun Mengikut Tarikh Terkini
            const dateA = new Date(a.Timestamp || 0).getTime() || 0;
            const dateB = new Date(b.Timestamp || 0).getTime() || 0;
            return dateB - dateA;
        });

        // Kemaskini Kad Statistik
        const total = filtered.length;
        let cemerlangCount = 0;
        let sederhanaCount = 0;
        let intervensiCount = 0;
        let totalScoreSum = 0;

        const cemerlangListHtml = [];
        const intervensiListHtml = [];

        filtered.forEach(item => {
            const score = parseFloat(item.Skor) || 0;
            totalScoreSum += score;

            if (score >= 90) {
                cemerlangCount++;
                cemerlangListHtml.push(`<div class="summary-item"><span><b>${item.Nama || 'N/A'}</b> (${item.Kelas || '-'})</span><span class="status-badge status-cemerlang">${score}%</span></div>`);
            } else if (score <= 50) {
                intervensiCount++;
                intervensiListHtml.push(`<div class="summary-item"><span><b>${item.Nama || 'N/A'}</b> (${item.Kelas || '-'})</span><span class="status-badge status-intervensi">${score}%</span></div>`);
            } else {
                sederhanaCount++;
            }
        });

        document.getElementById('stat-total').innerText = total;
        document.getElementById('stat-cemerlang').innerText = cemerlangCount;
        document.getElementById('stat-sederhana').innerText = sederhanaCount;
        document.getElementById('stat-intervensi').innerText = intervensiCount;
        document.getElementById('stat-purata').innerText = total > 0 ? (totalScoreSum / total).toFixed(1) + '%' : '0%';

        document.getElementById('list-cemerlang').innerHTML = cemerlangListHtml.length > 0 ? cemerlangListHtml.slice(0, 15).join('') : '<div style="font-size:12px; color:#94a3b8;">Tiada rekod.</div>';
        document.getElementById('list-intervensi').innerHTML = intervensiListHtml.length > 0 ? intervensiListHtml.slice(0, 15).join('') : '<div style="font-size:12px; color:#94a3b8;">Tiada rekod.</div>';

        // Kemaskini Jadual Utama
        const tbody = document.getElementById('table-body');
        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#64748b; padding:20px;">Tiada data murid ditemui bagi carian/penapis ini.</td></tr>`;
        } else {
            tbody.innerHTML = filtered.map(item => {
                const score = parseFloat(item.Skor) || 0;
                let badgeClass = "status-sederhana";
                let statusLabel = "Memuaskan";
                
                if (score >= 90) {
                    badgeClass = "status-cemerlang";
                    statusLabel = "Cemerlang";
                } else if (score <= 50) {
                    badgeClass = "status-intervensi";
                    statusLabel = "Intervensi";
                }

                const intervention = getInterventionText(score, item.Kategori);

                return `
                    <tr>
                        <td style="font-size:11px; color:#64748b;">${item.Timestamp || '-'}</td>
                        <td><b>${item.Nama || '-'}</b></td>
                        <td>${item.Kelas || '-'}</td>
                        <td><span style="color:#047857; font-weight:700;">${item.Modul || '-'}</span></td>
                        <td><span class="cat-badge">${item.Kategori || '-'}</span></td>
                        <td>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${Math.min(score, 100)}%;"></div>
                            </div>
                            <b>${score}%</b>
                        </td>
                        <td><span class="status-badge ${badgeClass}">${statusLabel}</span></td>
                        <td><span class="intervention-text">${intervention}</span></td>
                    </tr>
                `;
            }).join('');
        }

        renderChart(filtered);
    }

    // LUKIS CARTA MODUL
    function renderChart(data) {
        const modules = [
            "Module 1", "Module 2", "Module 3", "Module 4", "Module 5",
            "Module 6", "Module 7", "Module 8", "Module 9", "Module 10"
        ];
        
        const moduleScores = {};
        const moduleCounts = {};

        modules.forEach(m => {
            moduleScores[m] = 0;
            moduleCounts[m] = 0;
        });

        data.forEach(item => {
            const modText = item.Modul || "";
            modules.forEach(m => {
                if (modText.toLowerCase().includes(m.toLowerCase())) {
                    moduleScores[m] += parseFloat(item.Skor) || 0;
                    moduleCounts[m]++;
                }
            });
        });

        const averages = modules.map(m => moduleCounts[m] > 0 ? (moduleScores[m] / moduleCounts[m]).toFixed(1) : 0);

        const ctx = document.getElementById('moduleChart').getContext('2d');
        
        if (moduleChartInstance) {
            moduleChartInstance.destroy();
        }

        moduleChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [
                    "Modul 1: From?", 
                    "Modul 2: My Week", 
                    "Modul 3: In Past", 
                    "Modul 4: Celebrate", 
                    "Modul 5: Eat Right", 
                    "Modul 6: Get Around", 
                    "Modul 7: Helping Out", 
                    "Modul 8: Animals", 
                    "Modul 9: Get Active!", 
                    "Modul 10: Matter?"
                ],
                datasets: [{
                    label: 'Purata Skor (%)',
                    data: averages,
                    backgroundColor: 'rgba(16, 185, 129, 0.75)',
                    borderColor: '#047857',
                    borderWidth: 2,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: { font: { family: 'Fredoka', size: 12 } }
                    },
                    x: {
                        ticks: { font: { family: 'Fredoka', size: 11 } }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    // EXPORT DATA KE CSV
    function exportCSV() {
        if (rawData.length === 0) {
            alert("Tiada data untuk dieksport!");
            return;
        }

        let csvContent = "\uFEFF"; // UTF-8 BOM
        csvContent += "Timestamp,Nama,Kelas,Modul,Kategori,Skor,Tahap,Cadangan Intervensi\n";

        rawData.forEach(row => {
            const score = parseFloat(row.Skor) || 0;
            let status = "Sederhana";
            if (score >= 90) status = "Cemerlang";
            else if (score <= 50) status = "Intervensi";

            const intervention = getInterventionText(score, row.Kategori).replace(/,/g, ';');
            const cleanName = `"${(row.Nama || '').replace(/"/g, '""')}"`;
            const cleanModule = `"${(row.Modul || '').replace(/"/g, '""')}"`;

            csvContent += `"${row.Timestamp || ''}",${cleanName},"${row.Kelas || ''}",${cleanModule},"${row.Kategori || ''}",${score},"${status}","${intervention}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `Analisis_Murid_Year4_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
